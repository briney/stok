[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stok"
version = "0.1.4"
description = "Encoder-only protein tagger (SDPA + RoPE + SwiGLU)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bryan Briney" }]
dependencies = [
  "torch",
  "hydra-core",
  "omegaconf",
  "graphein",
  "torch_geometric",
  "click>=8.1",
  "wandb",
  "accelerate",
  "rich>=13.7",
  "tokenizers",
  "numpy",
  "pandas",
  "pyarrow>=12",
  "biopython",
  "scikit-learn",
  "transformers",
  "x-transformers",
  "vector-quantize-pytorch",
  "typing-extensions; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["stok*"]
exclude = []


[tool.setuptools.package-data]
stok = [
  "configs/**",
  "checkpoints/**",
]


[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]

[project.scripts]
stok = "stok.cli.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["stok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
