[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stok"
version = "0.1.4"
description = "Encoder-only protein tagger (SDPA + RoPE + SwiGLU)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bryan Briney" }]
dependencies = [
  "torch",
  "hydra-core",
  "omegaconf",
  "graphein>=1.7.8",
  "torch_geometric",
  "click>=8.1",
  "wandb",
  "accelerate",
  "tqdm>=4.66",
  "tokenizers",
  "numpy",
  "pandas",
  "pyarrow>=12",
  "biopython",
  "scikit-learn",
  "transformers",
  "x-transformers==2.8.0",
  "vector-quantize-pytorch==1.25.2",
  "typing-extensions; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["stok*"]
exclude = []


[tool.setuptools.package-data]
stok = [
  "configs/**",
  "checkpoints/**",
]


[project.scripts]
stok = "stok.cli.cli:cli"


[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.6", "ty==0.0.78"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
