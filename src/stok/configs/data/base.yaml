# Plain Parquet dataset directories (see stok.data.format).
max_len: 1280
num_workers: 4
pin_memory: true
prefetch_factor: 4
load_coords: null  # null loads coordinates only for decoded evaluation
# Single path, or named sources with path/fraction/load_coords.
train: {}
# Single path, or named sources with path/batch_size/load_coords.
eval: {}
shuffle_shards: true
shuffle_rows: true
