# "base" model size (~865M parameters)
encoder:
  d_model: 1536
  n_heads: 24  # target head_dim is 64
  n_layers: 36
  ffn_mult: 2.667  # 8/3 to account for SwiGLU projection
  vocab_size: 32
  pad_id: 1
  dropout: 0.1
  attn_dropout: 0.0
  norm: "layernorm"  # "layernorm" or "rmsnorm"

classifier:
  learnable_temperature: true
  use_cosine: false
  bias_from_code_norm: true
  projector_dim: null
  ignore_index: -100

init:
  std: 0.02

codebook:
  preset: "base"  # "base" or "lite"
  path: null

decoder:
  enabled: false
  preset: null    # if null, inherit from model.codebook.preset
  path: null      # overrides preset when set
  freeze: true


