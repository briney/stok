# "base" model size (~865M parameters)
encoder:
  d_model: 1280
  n_heads: 20
  n_layers: 33
  ffn_mult: 4.0
  vocab_size: 32
  pad_id: 1
  dropout: 0.1
  attn_dropout: 0.0
  norm: "layernorm"

classifier:
  tie_to_codebook: true
  learnable_temperature: true
  use_cosine: false
  bias_from_code_norm: true
  projector_dim: null
  ignore_index: -100

init:
  std: 0.02

codebook:
  preset: "base"  # "base" or "lite"
  path: null
  trainable: false

decoder:
  enabled: false
  preset: null    # if null, inherit from model.codebook.preset
  path: null      # overrides preset when set
  freeze: true


