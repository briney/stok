# "base" model size (~865M parameters)
encoder:
  d_model: 1536
  n_heads: 24  # target head_dim is 64
  n_layers: 36
  ffn_mult: 2.667  # 8/3 to account for SwiGLU projection
  dropout: 0.1
  attn_dropout: 0.0
  norm: "layernorm"  # "layernorm" or "rmsnorm"

codebook:
  preset: base
  path: null

decoder:
  preset: null  # null inherits the codebook preset when generation.decode is true
  path: null
