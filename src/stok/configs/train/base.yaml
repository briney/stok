optimizer:
  name: adamw
  lr: 3e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01

scheduler:
  decay: linear  # "cosine" | "linear"
  warmup_steps: 2000
  stable_steps: 0      # if 0, no stable hold, decay starts immediately after warmup
  decay_steps: null    # if null, auto-derived as (num_steps − warmup_steps − stable_steps), clamped at 0


# step/epoch governance
num_steps: 10000
epochs: null

# intervals (in steps)
eval_steps: 1000
log_steps: 50
checkpoint_steps: null

# training mechanics
grad_accum_steps: 1
grad_clip_norm: 1.0

# IO paths
project_path: null

# logging
wandb:
  enabled: true
  project: "stok"
  entity: null
  group: null
  name: null
  tags: []

# console output
console:
  enabled: true

# Training objective: "codebook" (structure token prediction) or "mlm" (masked language modeling)
objective: "codebook"

# MLM-specific settings (only used when objective="mlm")
mlm:
  mask_prob: 0.15           # Probability of selecting a token for masking
  mask_token_prob: 0.8      # Of selected tokens, prob of replacing with <mask>
  random_token_prob: 0.1    # Of selected tokens, prob of replacing with random token
  tie_word_embeddings: true # Whether to tie LM head weights to input embeddings

# Pre-trained encoder checkpoint for initializing codebook training from MLM pre-training
pretrained_encoder: null

fape:
  enabled: false
  start_step: 0
  weight: 0.1
  log_pred_nan_frac: true

gumbel:
  tau_start: 1.0
  tau_end: 0.5
  anneal_steps: 20000
  hard: false

decoding:
  eval_enabled: false
  eval_method: "argmax"  # "argmax" | "top_p"
  top_p: 0.9
  temperature: 1.0

# Evaluation metrics configuration
# Each metric can be enabled/disabled and configured with specific parameters.
# Metrics are automatically filtered by objective compatibility and resource availability.
#
# These settings define the DEFAULTS for all eval datasets. Per-dataset metric
# configuration can be specified in data.eval.{dataset_name}.metrics to override
# these defaults. See configs/data/base.yaml for per-dataset configuration examples.
#
# Metric categories:
#   - Classification metrics: Work with sequence-only data (no coordinates needed)
#   - Structure metrics: Require coordinates (load_coords: true) and decoder
#   - Contact metrics: Require coordinates but not decoder
#
# Per-dataset metric selection (in data config):
#   - Use 'metrics.only: [list]' to whitelist specific metrics for a dataset
#   - Use 'metrics.{metric}.enabled: true/false' to enable/disable specific metrics
#   - Use 'load_coords: true/false' to control per-dataset coordinate loading
#   - Structure metrics auto-skip datasets without coordinates
eval:
  metrics:
    # Classification metrics (sequence-only, no coordinates needed)
    accuracy:
      enabled: true
      # objectives: [codebook]  # Auto-filtered by objective
    masked_accuracy:
      enabled: true
      # objectives: [mlm]  # Auto-filtered by objective
    perplexity:
      enabled: true
      # objectives: null  # Works for all objectives

    # Structure metrics (require decoder and coordinates)
    lddt:
      enabled: false  # Enable via decoding.eval_enabled or per-dataset override
      # objectives: [codebook]
      # requires_decoder: true
      # requires_coords: true
    tm_score:
      enabled: false
    rmsd:
      enabled: false
    fape:
      enabled: false

    # Diagnostic metrics
    pred_nan_frac:
      enabled: false

    # Contact prediction (MLM only, requires coordinates)
    p_at_l:
      enabled: false
      contact_threshold: 8.0
      min_seq_sep: 6
      use_attention: true
      # objectives: [mlm]
      # requires_coords: true
