optimizer: adamw
lr: 3e-4
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1e-8
weight_decay: 0.01

scheduler: warmup_linear  # warmup_linear | warmup_cosine | wsd_linear | wsd_cosine
warmup_steps: 2000
stable_steps: 0      # WSD plateau; must be 0 for warmup_* schedules
decay_steps: null    # if null, derived from max_steps minus warmup and stable steps

seed: 1337

# All step budgets/cadences count successful optimizer updates.
# Choose exactly one budget; epoch runs set max_steps=null.
# Final partial accumulation windows are flushed.
# step/epoch governance
max_steps: 10000
max_epochs: null

# intervals (in successful optimizer updates)
log_every: 50
save_every: null

# training mechanics
batch_size: 8  # per process/device, before gradient accumulation
mixed_precision: null  # null inherits Accelerate; MDLM experiments select it explicitly
gradient_accumulation_steps: 1
max_grad_norm: 1.0

# IO paths
output_dir: null
resume_from: null  # complete version-4 continuation with the original budget

# logging
wandb:
  enabled: true
  project: "stok"
  entity: null
  group: null
  name: null
  tags: []
  mode: null

# console output
console:
  enabled: true

# Supported paired absorbing masked diffusion recipe.
objective: mdlm
mdlm:
  placement: token
  regime_weights:
    joint_independent: 1.0
    structure_only: 0.0
    sequence_only: 0.0
    joint_tied: 0.0
  noise:
    name: linear
    min_mask_probability: 0.0001
  sequence_loss_weight: 1.0
  structure_loss_weight: 1.0

eval:
  steps: 1000
  mdlm:
    enabled: false
    case_manifest: null
    families: null
    generation:
      enabled: false
      steps: 10000
      sampling_steps: 64
      max_cases: 16
      families: null
      decode: false
      schedule: {name: linear}
