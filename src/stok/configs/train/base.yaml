optimizer:
  name: adamw
  lr: 3e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01

scheduler:
  decay: cosine
  warmup_steps: 2000
  stable_steps: 0      # if 0, no stable hold, decay starts immediately after warmup
  decay_steps: null    # if null, auto-derived as (num_steps − warmup_steps − stable_steps), clamped at 0


# step/epoch governance
num_steps: 10000
epochs: null

# intervals (in steps)
eval_steps: 1000
log_steps: 50
checkpoint_steps: null

# training mechanics
grad_accum_steps: 1
grad_clip_norm: 1.0

# IO paths
project_path: null

# logging
wandb:
  enabled: true
  project: "stok"
  entity: null
  group: null
  name: null
  tags: []

fape:
  enabled: false
  start_step: 0
  weight: 0.1

gumbel:
  tau_start: 1.0
  tau_end: 0.5
  anneal_steps: 20000
  hard: false

decoding:
  eval_enabled: true
  eval_method: "argmax"  # "argmax" | "top_p"
  top_p: 0.9
  temperature: 1.0
