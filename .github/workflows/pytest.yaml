name: tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            ACCELERATE_USE_CPU: 'true'
            OMP_NUM_THREADS: '1'
            MKL_NUM_THREADS: '1'
            TOKENIZERS_PARALLELISM: 'false'
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.13"]

        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - name: Install project and test deps
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e '.[dev]'
            - name: Test with pytest
              run: |
                  python -m pytest tests/unit tests/integration --ignore=tests/integration/test_distributed_training.py -q
            - name: Correctness lint
              if: matrix.python-version == '3.13'
              run: python -m ruff check src tests

    distributed-cpu:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            ACCELERATE_USE_CPU: 'true'
            CUDA_VISIBLE_DEVICES: ''
            OMP_NUM_THREADS: '1'
            MKL_NUM_THREADS: '1'
            TOKENIZERS_PARALLELISM: 'false'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e '.[dev]'
            - name: Bounded two-process CPU regressions
              run: python -m pytest tests/integration/test_distributed_training.py -q
