name: code quality

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    format:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install 'ruff==0.16.6'
            - run: python -m ruff format --check .

    types:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e '.[dev]'
            - run: python -m ty check src --python "$(command -v python)" --error-on-warning
