# MDLM Stage 2: Joint sequence + structure training
#
# Fine-tune on paired sequence + structure data using two-track masked diffusion.
# Initialize from a stage 1 (seq_only) checkpoint for best results.
#
# Usage:
#   stok train --config configs/examples/mdlm_joint.yaml \
#     train.pretrained_encoder=/abs/path/to/stage1_checkpoint.pt \
#     data.train=/abs/path/to/paired_data.parquet

train:
  objective: mdlm
  num_steps: 50000
  log_steps: 100
  checkpoint_steps: 5000
  grad_accum_steps: 4
  grad_clip_norm: 1.0

  optimizer:
    name: adamw
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01

  scheduler:
    decay: cosine
    warmup_steps: 1000

  mdlm:
    tracks: joint
    noise_schedule_seq:
      type: cosine
    noise_schedule_struct:
      type: cosine
    lambda_seq: 1.0
    lambda_struct: 1.0
    time_conditioning: adaln
    time_combine: sum
    antithetic_time_sampling: true
    independent_track_times: true
    tie_seq_embeddings: true

  wandb:
    enabled: true
    project: stok
    tags: [mdlm, joint, stage2]

model:
  encoder:
    d_model: 1536
    n_heads: 24
    n_layers: 36
    ffn_mult: 2.667
    dropout: 0.1
    attn_dropout: 0.0

  codebook:
    preset: base

data:
  batch_size: 16
  max_len: 512
  num_workers: 4
