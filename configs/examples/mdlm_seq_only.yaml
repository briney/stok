# MDLM Stage 1: Sequence-only pretraining
#
# Pre-train on large unlabeled sequence datasets using masked diffusion.
# This stage learns protein sequence representations that can be transferred
# to joint sequence + structure training in stage 2.
#
# Usage:
#   stok train --config configs/examples/mdlm_seq_only.yaml \
#     data.train=/abs/path/to/sequences.parquet

train:
  objective: mdlm
  num_steps: 100000
  log_steps: 100
  checkpoint_steps: 10000
  grad_accum_steps: 4
  grad_clip_norm: 1.0

  optimizer:
    name: adamw
    lr: 3e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01

  scheduler:
    decay: cosine
    warmup_steps: 2000

  mdlm:
    tracks: seq_only
    noise_schedule_seq:
      type: cosine
    time_conditioning: adaln
    antithetic_time_sampling: true
    tie_seq_embeddings: true

  wandb:
    enabled: true
    project: stok
    tags: [mdlm, seq_only, stage1]

model:
  encoder:
    d_model: 1536
    n_heads: 24
    n_layers: 36
    ffn_mult: 2.667
    dropout: 0.1
    attn_dropout: 0.0

data:
  batch_size: 32
  max_len: 512
  num_workers: 4
