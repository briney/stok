data:
  batch_size: 2
  max_len: 16
  num_workers: 0
  pin_memory: false
  train: /private/var/folders/61/gd4_q9ps5m59r1npdyscnh8r0000gn/T/pytest-of-bryanbriney/pytest-20/test_training_with_decoder_and0/train.parquet
